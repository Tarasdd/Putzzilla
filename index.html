    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // По умолчанию всё запрещено, пока посетитель не нажал «Alle akzeptieren».
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });

      // Вызывается баннером после согласия. До этого GTM вообще не загружается.
      window.loadGTM = function () {
        if (window.__gtmLoaded) return;
        window.__gtmLoaded = true;
        gtag('consent', 'update', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
          analytics_storage: 'granted'
        });
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-TP7LZ667');
      };

      // Посетитель уже согласился раньше — загружаем сразу.
      if (/(?:^|;\s*)cookieConsent=accepted(?:;|$)/.test(document.cookie)) {
        window.loadGTM();
      }
    </script>
    <!-- End Google Tag Manager -->
